<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan's Brew Cafe - SKU Generator</title>

    <!-- python -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <!-- sw1 style stuff but improvised -->
    <style>
        body{
            font-family: 'Lato', sans-serif;
            background-color: #74A12E;
            text-align: center;
            color: #000000;
            font-size: 25px;
        }
        nav{
            background-color: #3F5F24;
            padding: 15px;
            margin-bottom: 20px;
        }
        nav a{
            color: #F5EEDC;
            margin: 0 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 18px;
        }

        .container{
            width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: #F5EEDC;
            border-radius: 25px;
            box-shadow: 0 10px 30px #3F5F24;
        }
        .container button{
            padding: 12px 35px;
            margin: 15px;
            background-color: #C47A44;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        h1{
            color: #3F5F24;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            margin-bottom: 10px;
        }
        h3{
            color: #5C3B28;
        }
        .input-stuff{
            text-align: left;
            margin: 15px 0;
        }
        .input-stuff label{
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #5C3B28;
            margin-bottom: 5px;
        }
        .input-stuff input{
            width: 100%;
            padding: 12px 20px;
            background-color: #FFF9EC;
            border: 2px solid #C47A44;
            border-radius: 12px;
            font-size: 20px;
            color: #000000;
        }
        .sku-output{
            margin-top: 25px;
            padding: 20px;
            background-color: #FFF9EC;
            border-radius: 15px;
            border: 2px solid #5C3B28;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #3F5F24;
        }
    </style>
</head>
<body>
    <!-- same body as index.html but for sku generator-->
    <nav>
        <a href="index.html">Receipt Generator</a>
        <a href="skugen.html">SKU Generator</a>
    </nav>

<div class="container">
    <h1>Jan's Brew Cafe</h1>
    <h3>Sku Generator!!</h3>


    <div class="input-stuff">
            <label for="category">Product Category:</label>
            <input type="text" id="category" placeholder="ex: Coffee">
        </div>

        <div class="input-stuff">
            <label for="pname">Product Name:</label>
            <input type="text" id="pname" placeholder="ex: Spanish Latte">
        </div>

        <div class="input-stuff">
            <label for="qty">Stock Quantity:</label>
            <input type="number" id="qty" placeholder="ex: 100">
        </div>

        <button py-click="generate_sku">Generate SKU</button>

        <div class="sku-output">
            <div id="div_id">Here is your SKU below!</div>
        </div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
